<!DOCTYPE html>
<html lang="$lang$">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="skelepress reader template">
<title>$title$</title>
$if(subtitle)$<meta name="description" content="$subtitle$">$endif$
<style>
/* skelepress reader — toolkit stylesheet, wave 1 (lite).
   One custom-props palette, dark mode via prefers-color-scheme, no framework. */
:root {
  --ink: #1f2933;
  --paper: #fdfdfc;
  --accent: #35619c;
  --rule: #d9d9d4;
  --code-bg: #f4f4f0;
  --ui-font: system-ui, -apple-system, "Segoe UI", sans-serif;
  --text-font: Georgia, "Times New Roman", serif;
  --code-font: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #d5d9dd;
    --paper: #14181c;
    --accent: #8fb4e8;
    --rule: #2c3238;
    --code-bg: #1c2126;
  }
  img { opacity: .9; }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.65 var(--text-font);
}
/* ---- layout: a static sidebar on wide screens; the document flows first on
   narrow ones, where the reading experience does not depend on the TOC. ---- */
.layout { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
@media (max-width: 860px) {
  .layout { display: block; }
  .sidebar { display: none; }
}
.sidebar {
  position: sticky; top: 0;
  max-height: 100vh; overflow-y: auto;
  border-right: 1px solid var(--rule);
  padding: 1.4rem 1rem 3rem;
  font-family: var(--ui-font);
  font-size: .85rem;
}
.masthead { margin-bottom: 1.2rem; }
.masthead .title { font-size: 1rem; font-weight: 700; margin: 0 0 .15rem; }
.masthead .subtitle { font-size: .8rem; color: var(--accent); margin: 0 0 .3rem; }
.masthead .author, .masthead .date { font-size: .75rem; color: var(--ink); opacity: .75; margin: 0; }
.toc-title { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; opacity: .6; margin: 1rem 0 .4rem; }
#TOC ul { list-style: none; margin: 0; padding: 0; }
#TOC ul ul { padding-left: .9em; }
#TOC a { display: block; padding: .18rem .45rem; border-radius: 4px; color: inherit; text-decoration: none; }
#TOC a:hover { background: var(--code-bg); }
#TOC li.toc-active > a { background: var(--code-bg); color: var(--accent); font-weight: 600; }
.skip-link {
  position: absolute; left: -999px;
}
.skip-link:focus { left: .5rem; top: .5rem; background: var(--paper); color: var(--accent); padding: .4rem .6rem; border: 1px solid var(--rule); z-index: 10; }
/* ---- content ---- */
main {
  padding: 2.5rem 1.25rem 4rem;
  max-width: 44rem;
  margin: 0 auto;
}
main > section.level1, main > section.page-break {
  padding-top: 3.2rem;
}
main > section:first-of-type { padding-top: 0; }
h1, h2, h3, h4, h5, h6 {
  font-family: var(--ui-font);
  line-height: 1.25;
  color: var(--ink);
  scroll-margin-top: 1.5rem;
}
h1 { font-size: 1.7rem; margin: 0 0 1rem; }
h2 { font-size: 1.25rem; margin: 1.8rem 0 .7rem; }
h3 { font-size: 1.05rem; margin: 1.4rem 0 .5rem; }
p, li { max-width: 70ch; }
a { color: var(--accent); }
code { font-family: var(--code-font); font-size: .88em; background: var(--code-bg); padding: .1em .35em; border-radius: 4px; }
pre { background: var(--code-bg); border: 1px solid var(--rule); border-radius: 6px; padding: .8rem 1rem; overflow-x: auto; }
pre code { background: none; padding: 0; }
blockquote { margin: 1rem 0; padding: .2rem 1rem; border-left: 3px solid var(--rule); color: var(--ink); opacity: .82; }
img { max-width: 100%; height: auto; }
table { width: 100%; border-collapse: collapse; font-family: var(--ui-font); font-size: .92em; }
th, td { border: 1px solid var(--rule); padding: .45rem .6rem; text-align: left; }
thead { background: var(--code-bg); }
hr { border: none; border-top: 1px solid var(--rule); margin: 2.5rem 0; }
/* ---- chapter pager: filled in by script; without it the TOC still carries navigation ---- */
.pager {
  margin-top: 3.5rem; padding-top: 1rem;
  border-top: 1px solid var(--rule);
  display: flex; justify-content: space-between; gap: 1rem;
  font-family: var(--ui-font); font-size: .9rem;
}
.pager a { text-decoration: none; }
.pager a span.label { display: block; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; opacity: .55; }
.pager .next { margin-left: auto; text-align: right; }
@media print {
  .sidebar, .pager, .skip-link { display: none !important; }
  .layout { display: block; }
  main { max-width: none; padding: 0; }
  a { color: inherit; text-decoration: none; }
}
</style>
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<div class="layout">
  <nav class="sidebar" aria-label="Table of contents">
    <div class="masthead">
      <p class="title">$title$</p>
      $if(subtitle)$<p class="subtitle">$subtitle$</p>$endif$
      $if(author)$<p class="author">$author$</p>$endif$
      $if(date)$<p class="date">$date$</p>$endif$
    </div>
    $if(toc)$
    <p class="toc-title">Contents</p>
    <div id="TOC">
    $toc$
    </div>
    $endif$
  </nav>
  <main id="content">
$body$
    <nav class="pager" hidden aria-hidden="true">
      <a class="prev" rel="prev" href=""><span class="label">Previous</span><span class="dest"></span></a>
      <a class="next" rel="next" href=""><span class="label">Next</span><span class="dest"></span></a>
    </nav>
  </main>
</div>
<script>
/* skelepress reader — optional enhancements. Without script the document is a
   complete, navigable book: the sidebar TOC links to every section. The script
   adds the active-chapter highlight and the prev/next pager, both derived from
   the top-level sections the PDF/EPUB treatments already split on. */
(function () {
  var chapters = Array.prototype.slice.call(
    document.querySelectorAll("#content > section[id]")
  );
  var links = Array.prototype.slice.call(document.querySelectorAll("#TOC a"));
  function linkFor(id) {
    var best = null;
    links.forEach(function (a) {
      var hash = (a.getAttribute("href") || "").replace(/^#/, "");
      if (hash === id) best = a;
      if (!best && hash !== "" && id.startsWith(hash)) best = a;
    });
    return best;
  }
  /* Active chapter in the sidebar. */
  if ("IntersectionObserver" in window) {
    var current = null;
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          current = entry.target.id;
        }
      });
      links.forEach(function (a) {
        var li = a.parentElement;
        if (li) li.classList.remove("toc-active");
      });
      var active = current && linkFor(current);
      if (active && active.parentElement) active.parentElement.classList.add("toc-active");
      updatePager(current);
    }, { rootMargin: "-10% 0px -75% 0px" });
    chapters.forEach(function (section) { observer.observe(section); });
  }
  /* Prev/next pager between top-level chapters. */
  var pager = document.querySelector(".pager");
  function updatePager(currentId) {
    if (!pager) return;
    var index = chapters.findIndex(function (s) { return s.id === currentId; });
    if (index < 0) { pager.hidden = true; return; }
    pager.hidden = false;
    var prev = chapters[index - 1], next = chapters[index + 1];
    var prevA = pager.querySelector(".prev"), nextA = pager.querySelector(".next");
    function fill(a, section) {
      if (section) {
        a.href = "#" + section.id;
        var heading = section.querySelector("h1, h2, h3");
        a.querySelector(".dest").textContent = heading ? heading.textContent : section.id;
      } else {
        a.removeAttribute("href");
        a.querySelector(".dest").textContent = "";
        a.classList.add("unavailable");
      }
    }
    fill(prevA, prev);
    fill(nextA, next);
  }
})();
</script>
</body>
</html>
