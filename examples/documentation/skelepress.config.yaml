version: 1

project:
  name: toolkit-documentation
  # The example lives two levels down, so the repository root is the base.
  base_dir: "../.."

document:
  title: "Skelepress"
  subtitle: "Documentation"
  author: "The Example Maintainers"
  publisher: "Public Domain Press"
  date: "2026"
  rights: "Repository documentation, MIT licensed"
  language: "en"
  titlepage: true

input:
  chapters_dir: "docs"
  glob: "*.md"
  order: natural
  # Reading order, derived from the VitePress sidebar — the ONE canonical
  # order, defined in site/.vitepress/config.mts. A test in tests/l1/docs.sh
  # fails when this list and the sidebar diverge, so change the sidebar first
  # and mirror it here. `explicit_files` wins over `glob`, so this list decides;
  # a test also fails if a document under docs/ is missing from it.
  # README.md navigates the tree on GitHub and index.md is the web-site landing
  # page (site/, VitePress); neither is PDF content, so both stay out of this
  # list.
  explicit_files:
    - "user/install.md"
    - "user/dependencies.md"
    - "user/usage.md"
    - "user/books.md"
    - "user/migration.md"
    - "dev/architecture.md"
    - "dev/releasing.md"
    - "dev/dependency-policy.md"
    - "dev/i18n.md"

output:
  formats: [pdf, epub]
  # Paths resolve against project.base_dir (the repository root here),
  # so this points inside the repository's ignored output area.
  dir: "examples/.output/documentation"
  file_prefix: "toolkit-documentation"
  suffix: "${date:YYYYMMDD}"
  keep_merged_markdown: false

pandoc:
  pdf_engine: xelatex
  toc: true
  toc_depth: 2
  number_sections: true
  # base_dir is already the repository root, so the documents resolve from here.
  resource_path:
    - "."

filters:
  # Both filters are off: a disabled filter needs no other settings.
  # The documentation has no diagrams. Its status glyphs (U+274C, U+2705)
  # are mapped to GNU FreeSerif by the template when that font exists; without
  # it the PDF warns and leaves gaps. Enabling the emoji filter would replace
  # them with images at the cost of a network fetch.
  emoji:
    enabled: false
  mermaid:
    enabled: false
  extra_lua_filters: []

runtime:
  required_commands:
    - pandoc
    - xelatex
    - python3
  strict: true

compat:
  # Each document starts on a fresh page, which is what a compilation wants.
  legacy_clearpage_between_h1: true
